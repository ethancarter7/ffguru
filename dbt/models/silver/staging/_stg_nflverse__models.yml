# Documents and tests the first silver staging model.

version: 2

models:
  - name: stg_nflverse__ff_rankings
    description: Draft ranking snapshots exposed from bronze with their snapshot dates.
    columns:
      - name: snapshot_date
        description: UTC logical date assigned to the immutable ingestion snapshot.
        data_tests:
          - not_null
      - name: player_id
        description: FantasyPros identifier supplied with the ranking.
        data_tests:
          - not_null
      - name: player
        description: Player or team-defense name supplied by the ranking source.
        data_tests:
          - not_null
  - name: stg_nflverse__player_stats
    description: Requested player-stat fields from every immutable weekly snapshot.
    columns:
      - name: snapshot_date
        description: UTC logical date assigned to the immutable ingestion snapshot.
        data_tests:
          - not_null
      - name: player_id
        description: NFL GSIS identifier supplied with the player statistics.
      - name: game_id
        description: nflverse identifier for the game represented by the weekly row.
      - name: position
        description: Player position supplied by nflverse.
      
