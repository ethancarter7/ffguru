# Declares the Python version and direct dependencies used to develop the data platform.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ffguru"
version = "0.1.0"
description = "A learning-focused data platform for fantasy-football research."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apache-airflow==3.3.1",
    "boto3==1.43.56",
    "dbt-duckdb>=1.9,<2",
    "flask>=3.1,<4",
    "nflreadpy>=0.1,<1",
]

[tool.uv]
constraint-dependencies = [
    "botocore==1.43.56",
    "importlib-metadata>=8,<9",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
